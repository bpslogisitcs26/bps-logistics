<script>
"use strict";

const DEFAULT_ID="ADMINBPS";
const DEFAULT_PASSWORD="BABU@2026";

let adminId=localStorage.getItem("bpsAdminId")||DEFAULT_ID;
let adminPassword=localStorage.getItem("bpsAdminPassword")||DEFAULT_PASSWORD;

let editingId=null;
let currentPrintId=null;

function $(id){
  return document.getElementById(id);
}

function val(id){
  return $(id)?.value || "";
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function loadRememberedLogin(){
  const remember=localStorage.getItem("bpsRememberLogin")==="1";

  if($("rememberLogin"))
    $("rememberLogin").checked=remember;

  if($("loginId"))
    $("loginId").value=
      remember
      ?(localStorage.getItem("bpsRememberedId")||adminId)
      :DEFAULT_ID;

  if($("loginPassword"))
    $("loginPassword").value=
      remember
      ?(localStorage.getItem("bpsRememberedPassword")||"")
      :"";
}

function login(){
  const enteredId=$("loginId").value.trim();
  const enteredPassword=$("loginPassword").value;

  if(enteredId===DEFAULT_ID && enteredPassword===DEFAULT_PASSWORD){
    adminId=DEFAULT_ID;
    adminPassword=DEFAULT_PASSWORD;

    localStorage.setItem("bpsAdminId",DEFAULT_ID);
    localStorage.setItem("bpsAdminPassword",DEFAULT_PASSWORD);
  }

  if(enteredId===adminId && enteredPassword===adminPassword){

    if($("rememberLogin").checked){
      localStorage.setItem("bpsRememberLogin","1");
      localStorage.setItem("bpsRememberedId",enteredId);
      localStorage.setItem("bpsRememberedPassword",enteredPassword);
    }else{
      localStorage.removeItem("bpsRememberLogin");
      localStorage.removeItem("bpsRememberedId");
      localStorage.removeItem("bpsRememberedPassword");
    }

    sessionStorage.setItem("bpsLogin","1");

    $("loginPage").classList.add("hidden");
    $("app").classList.remove("hidden");

    updateStats();
    renderBookings();
    renderCustomers();

  }else{
    alert("Wrong Admin ID or Password.");
  }
}

function logout(){
  sessionStorage.removeItem("bpsLogin");
  $("app").classList.add("hidden");
  $("loginPage").classList.remove("hidden");
  loadRememberedLogin();
}

$("loginBtn").onclick=login;
$("logoutBtn").onclick=logout;

$("loginPassword").onkeydown=function(e){
  if(e.key==="Enter") login();
};

$("eyeBtn").onclick=function(){
  const p=$("loginPassword");
  p.type=p.type==="password"?"text":"password";
};

loadRememberedLogin();
</script>

  <script>

function bookings(){
  try{
    return JSON.parse(localStorage.getItem("bpsBookings")||"[]");
  }catch(e){
    return [];
  }
}

function saveData(data){
  localStorage.setItem("bpsBookings",JSON.stringify(data));
}

function company(){
  return {
    address:
      localStorage.getItem("bpsCompanyAddress")||
      "NABAHAT FAGUPUR, NEAR HOTEL HIGHWAY INN, PURBA BURDWAN, WEST BENGAL",

    phone:
      localStorage.getItem("bpsCompanyPhone")||
      "8609636690",

    pin:
      localStorage.getItem("bpsCompanyPin")||
      "713104"
  };
}

function readForm(){

  return {
    id:editingId||Date.now(),
    createdAt:new Date().toISOString(),

    consignmentType:val("consignmentType"),
    requestedBy:val("requestedBy"),

    courier:val("courier"),
    awb:val("awb"),

    invoiceValue:Number(val("invoiceValue"))||0,
    ewayBill:val("ewayBill"),
    hsnCode:val("hsnCode"),
    invoiceDate:val("invoiceDate"),
    invoiceNumber:val("invoiceNumber"),
    codAmount:Number(val("codAmount"))||0,
    quantity:Number(val("quantity"))||1,
    revenue:Number(val("revenue"))||0,

    conName:val("conName"),
    conContact:val("conContact"),
    conPin:val("conPin"),
    conPhone:val("conPhone"),
    conLine1:val("conLine1"),
    conLine2:val("conLine2"),
    conCity:val("conCity"),
    conState:val("conState"),
    conEmail:val("conEmail"),
    conLegal:val("conLegal"),

    recName:val("recName"),
    recContact:val("recContact"),
    recPin:val("recPin"),
    recPhone:val("recPhone"),
    recLine1:val("recLine1"),
    recLine2:val("recLine2"),
    recCity:val("recCity"),
    recState:val("recState"),
    recEmail:val("recEmail"),
    recLegal:val("recLegal"),

    material:val("material"),
    weight:Number(val("weight"))||0,
    status:val("status"),
    expense:Number(val("expense"))||0,
    pickupMethod:val("pickupMethod"),
    paymentMode:val("paymentMode"),
    billToParty:val("billToParty"),
    promoCode:val("promoCode"),
    notes:val("notes")
  };
}

function clearForm(){

  editingId=null;
  currentPrintId=null;

  $("bookingForm").reset();

  $("quantity").value=1;
  $("status").value="Booked";

  $("invoiceDate").value=
    new Date().toISOString().slice(0,10);
}

function saveDocket(){

  const b=readForm();

  if(!b.courier){
    alert("Please select Courier Partner.");
    return;
  }

  if(!b.awb){
    alert("Please enter Tracking ID / Docket Number.");
    return;
  }

  if(!b.conName && !b.recName){
    alert("Please enter Customer / Consignee name.");
    return;
  }

  let data=bookings();

  const existingIndex=data.findIndex(x=>x.id===b.id);

  if(existingIndex>=0){
    data[existingIndex]=b;
  }else{
    data.push(b);
  }

  saveData(data);

  currentPrintId=b.id;
  editingId=null;

  renderBookings();
  renderCustomers();
  updateStats();

  alert("Docket saved successfully.");

  showPage("bookings");
}

$("saveBtn").onclick=saveDocket;
$("clearBtn").onclick=clearForm;

</script>

  <script>

function renderBookings(){

  const body=$("bookingTable");

  if(!body)return;

  body.innerHTML="";

  bookings()
  .sort((a,b)=>b.id-a.id)
  .forEach(b=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${esc(b.invoiceDate||b.createdAt?.slice(0,10)||"")}</td>

      <td>
        <strong>${esc(b.awb||"")}</strong>
      </td>

      <td>${esc(b.invoiceNumber||"")}</td>

      <td>
        ₹${Number(b.invoiceValue||0).toLocaleString("en-IN")}
      </td>

      <td>${esc(b.conName||b.recName||"")}</td>

      <td>
        <strong>${esc(b.courier||"")}</strong>
      </td>

      <td>${esc(b.status||"")}</td>

      <td style="white-space:nowrap">

        <button class="btn blue"
          onclick="details(${b.id})">
          DETAILS
        </button>

        <button class="btn green"
          onclick="printById(${b.id})">
          PRINT
        </button>

        <button class="btn darkblue"
          onclick="downloadPDFById(${b.id})">
          PDF
        </button>

        <button class="btn gold"
          onclick="editById(${b.id})">
          EDIT
        </button>

        <button class="btn red"
          onclick="deleteById(${b.id})">
          DELETE
        </button>

      </td>
    `;

    body.appendChild(tr);
  });
}

function fill(b){

  const fields=[
    "consignmentType","requestedBy","courier","awb",
    "invoiceValue","ewayBill","hsnCode","invoiceDate",
    "invoiceNumber","codAmount","quantity","revenue",
    "conName","conContact","conPin","conPhone",
    "conLine1","conLine2","conCity","conState",
    "conEmail","conLegal",
    "recName","recContact","recPin","recPhone",
    "recLine1","recLine2","recCity","recState",
    "recEmail","recLegal",
    "material","weight","status","expense",
    "pickupMethod","paymentMode","billToParty",
    "promoCode","notes"
  ];

  fields.forEach(id=>{
    if($(id) && b[id]!==undefined)
      $(id).value=b[id];
  });

  editingId=b.id;

  showPage("booking");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function editById(id){

  const b=bookings().find(x=>x.id===id);

  if(b) fill(b);
}

function deleteById(id){

function updateStats(){

  const data=bookings();

  const total=data.length;

  const invoice=data.reduce(
    (sum,b)=>sum+Number(b.invoiceValue||0),
    0
  );

  const delivered=data.filter(
    b=>String(b.status).toLowerCase()==="delivered"
  ).length;

  const pending=data.filter(
    b=>String(b.status).toLowerCase()!=="delivered"
  ).length;

  if($("statBookings"))
    $("statBookings").textContent=total;

  if($("statInvoice"))
    $("statInvoice").textContent=
      "₹"+invoice.toLocaleString("en-IN");

  if($("statDelivered"))
    $("statDelivered").textContent=delivered;

  if($("statPending"))
    $("statPending").textContent=pending;

  renderAnalytics();
}

function renderAnalytics(){

  const data=bookings();

  const courierMap={};

  data.forEach(b=>{
    const name=b.courier||"Not Selected";

    courierMap[name]=
      (courierMap[name]||0)+1;
  });

  let html=`
    <table>
      <tr>
        <th>Courier Partner</th>
        <th>Bookings</th>
      </tr>
  `;

  Object.keys(courierMap)
  .sort()
  .forEach(name=>{
    html+=`
      <tr>
        <td>${esc(name)}</td>
        <td>${courierMap[name]}</td>
      </tr>
    `;
  });

  html+=`</table>`;

  $("analyticsBox").innerHTML=html;
}

function renderCustomers(){

  const list=$("customerList");

  if(!list)return;

  const map={};

  bookings().forEach(b=>{

    const key=
      b.conPhone||
      b.conName||
      b.recPhone||
      b.recName||
      "Unknown";

    if(!map[key])
      map[key]=b;
  });

  const arr=Object.values(map);

  if(!arr.length){
    list.innerHTML="<p>No customer data yet.</p>";

function showPage(page){

  document.querySelectorAll(".page")
  .forEach(p=>{
    p.classList.remove("active");
  });

  const target=$(page);

  if(target)
    target.classList.add("active");

  document.querySelectorAll(".navBtn")
  .forEach(btn=>{
    btn.classList.remove("active");

    if(btn.dataset.page===page)
      btn.classList.add("active");
  });

  if(page==="bookings")
    renderBookings();

  if(page==="customers")
    renderCustomers();

  if(page==="analytics")
    renderAnalytics();

  if(page==="settings")
    loadCompany();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

document.querySelectorAll(".navBtn")
.forEach(btn=>{

  btn.addEventListener("click",function(){

    showPage(this.dataset.page);

  });

});

function startup(){

  $("app").classList.add("hidden");
  $("loginPage").classList.remove("hidden");

  loadRememberedLogin();

  renderBookings();
  renderCustomers();
  updateStats();

  const savedLogin=
    sessionStorage.getItem("bpsLogin")==="1";

  if(savedLogin){

    $("loginPage").classList.add("hidden");
    $("app").classList.remove("hidden");

    updateStats();
  }

  $("invoiceDate").value=
    new Date().toISOString().slice(0,10);
}

startup();

</script>
